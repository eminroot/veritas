[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
# OpenZeppelin 5.7 still names a function `at`, which solc 0.8.38 warns will become a keyword.
ignored_warnings_from = ["lib"]
fs_permissions = [
  { access = "read", path = "./test/fixtures" },
  { access = "read", path = "./out" },
  { access = "read-write", path = "./deployments" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 4096

[lint]
# Each of these was reviewed against how Veritas works:
# - block-timestamp: deadlines are hours and days long, a few seconds of drift change nothing.
# - calls-loop, reentrancy-events: the calls go to Veritas's own contracts, wired once at deploy.
# - erc20-unchecked-transfer: the only token is vAZN, which reverts on failure.
# - require-revert-in-loop: every leaf in a proof list must be valid, so a bad one must revert.
# - uninitialized-local: Solidity zero-initialises locals; the lint misreads `x += ...`.
# - unsafe-oz-erc721-mint: receipts go to donor keys; _safeMint would call into contracts.
# - unsafe-typecast: every cast is bounded by a check or by MAX_MILESTONES.
# - unused-return: verifyLeaf is called for its revert, open() for its event.
# - environment-read-across-mutation: only tests read block.timestamp after vm.warp, on purpose.
exclude_lints = [
  "environment-read-across-mutation",
  "block-timestamp",
  "calls-loop",
  "reentrancy-events",
  "erc20-unchecked-transfer",
  "require-revert-in-loop",
  "uninitialized-local",
  "unsafe-oz-erc721-mint",
  "unsafe-typecast",
  "unused-return",
]

[fmt]
ignore = ["test/fixtures/*.sol"]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
