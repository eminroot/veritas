# Veritas analytics: the metafile for docs/analytics/star_schema.sql.
# It says, for every table and column, what it means, where it comes from (lineage),
# whether it is personal data, and how a measure may be added up. Generated from the same
# spec as star_schema.sql, so the two always agree. Strings are JSON-quoted, which YAML accepts.

model:
  name: "veritas_analytics"
  schema: "analytics"
  style: "star schema: 5 fact tables sharing 4 conformed dimension tables"
  source: "Veritas app database, PostgreSQL 17 (backend/migrations, 41 tables)"
  refresh: "planned: nightly full reload at 03:00 Baku time; the tables are small enough to rebuild"
  owner: "Avaz Asgarov (data engineering)"
  currency: "AZN, stored as whole qəpik (1 AZN = 100 qəpik); never floats"
  time_zone: "Asia/Baku (UTC+4) for every date and date_key"
  personal_data: "none copied: donors are pseudonymous ids; names, emails and phones stay in the app database"
  conventions:
    - pattern: "dim_<thing>"
      meaning: "Dimension table: the who, what, where and when that facts are described by. Singular noun: dim_project, not dim_projects."
    - pattern: "fact_<event>"
      meaning: "Fact table: one row per business event or measurement. Named after the event: fact_donation, fact_release."
    - pattern: "<dim>_key"
      meaning: "Surrogate key: a small whole number made by the warehouse, the primary key of a dimension and the foreign key in facts (project_key)."
    - pattern: "<thing>_id"
      meaning: "Natural key: the id the app database already uses (a UUID), kept so every row can be traced back (project_id)."
    - pattern: "date_key, <role>_date_key"
      meaning: "A day as the number yyyymmdd (20261108). Several dates on one fact get a role prefix: released_date_key, paid_date_key."
    - pattern: "<amount>_qapik"
      meaning: "Money, as a whole number of qəpik (₼1 = 100 qəpik). Never a float, so totals are exact."
    - pattern: "<thing>_count"
      meaning: "A count, added up across rows."
    - pattern: "is_<state>"
      meaning: "Yes/no flag (boolean)."
    - pattern: "days_<from>_to_<to>"
      meaning: "A duration in days, with one decimal."
    - pattern: "pk_, fk_, uq_, ck_, ix_"
      meaning: "Constraint and index names: pk_<table>, fk_<table>_<column>, uq_<table>_<column>, ck_<table>_<rule>, ix_<table>_<column>."
    - pattern: "row 0"
      meaning: "Every dimension has a row with key 0 for 'none': the guest donor, no target project, the whole project, a date that has not happened yet. Fact keys are therefore never empty."
tables:
  - name: "dim_date"
    type: "dimension"
    grain: "one calendar day, in Baku time (UTC+4)"
    description: "The calendar. Facts point here instead of storing dates, so 'by month' or 'weekends only' is a plain filter."
    source: "Generated by generate_series in star_schema.sql, 2025 to 2030. No app table."
    history: "none: a day never changes"
    row_zero: "date_key 0 = 'not yet' (for example a release the bank has not paid yet); its other columns are empty."
    primary_key: ["date_key"]
    columns:
      - name: "date_key"
        type: "integer"
        role: "primary key"
        nullable: false
        description: "The day as yyyymmdd. 0 means 'not yet'."
        lineage: "generated"
        pii: "none"
        example: 20261108
      - name: "full_date"
        type: "date"
        role: "attribute"
        nullable: true
        description: "The day itself. Empty only on row 0."
        lineage: "generated"
        pii: "none"
        example: "2026-11-08"
      - name: "year"
        type: "smallint"
        role: "attribute"
        nullable: true
        description: "Calendar year."
        lineage: "full_date"
        pii: "none"
        example: 2026
      - name: "quarter"
        type: "smallint"
        role: "attribute"
        nullable: true
        description: "Quarter of the year, 1 to 4."
        lineage: "full_date"
        pii: "none"
        example: 4
      - name: "month"
        type: "smallint"
        role: "attribute"
        nullable: true
        description: "Month, 1 to 12."
        lineage: "full_date"
        pii: "none"
        example: 11
      - name: "month_name"
        type: "text"
        role: "attribute"
        nullable: true
        description: "Month name in English."
        lineage: "full_date"
        pii: "none"
        example: "November"
      - name: "iso_week"
        type: "smallint"
        role: "attribute"
        nullable: true
        description: "ISO week number, 1 to 53."
        lineage: "full_date"
        pii: "none"
        example: 45
      - name: "day_of_week"
        type: "smallint"
        role: "attribute"
        nullable: true
        description: "1 = Monday ... 7 = Sunday (ISO)."
        lineage: "full_date"
        pii: "none"
        example: 7
      - name: "day_name"
        type: "text"
        role: "attribute"
        nullable: true
        description: "Day name in English."
        lineage: "full_date"
        pii: "none"
        example: "Sunday"
      - name: "is_weekend"
        type: "boolean"
        role: "attribute"
        nullable: true
        description: "Saturday or Sunday."
        lineage: "full_date"
        pii: "none"
        example: true
  - name: "dim_donor"
    type: "dimension"
    grain: "one donor account; row 0 stands for every guest who gave without an account"
    description: "Who gave, without saying who they are: no name, email or phone is copied here."
    source: "users (app database). A donor is a user with at least one donation."
    history: "type 1: a change overwrites the row (sign-in method is the only attribute that can change)"
    row_zero: "donor_key 0 = 'Guest': a card payment made without signing in."
    primary_key: ["donor_key"]
    columns:
      - name: "donor_key"
        type: "integer"
        role: "primary key"
        nullable: false
        description: "Surrogate key. 0 is the guest row."
        lineage: "generated"
        pii: "none"
        example: 42
      - name: "donor_id"
        type: "uuid"
        role: "natural key"
        nullable: true
        description: "The account's id in the app (users.id). Pseudonymous: it identifies an account, not a person, unless joined back to the app database."
        lineage: "users.id"
        pii: "pseudonymous"
        example: "6f1c…e2"
      - name: "sign_in_method"
        type: "text"
        role: "attribute"
        nullable: false
        description: "How the account signs in: email (a password), google, phone (a code sent by text, in the phone app) or guest."
        lineage: "users.password_hash, users.firebase_uid, users.phone"
        pii: "none"
        example: "google"
      - name: "joined_date"
        type: "date"
        role: "attribute"
        nullable: true
        description: "The day the account was made (Baku time). Empty for guests."
        lineage: "users.created_at"
        pii: "none"
        example: "2026-11-02"
      - name: "is_guest"
        type: "boolean"
        role: "attribute"
        nullable: false
        description: "True only on row 0."
        lineage: "generated"
        pii: "none"
        example: false
  - name: "dim_project"
    type: "dimension"
    grain: "one project, with its organisation, contractor, cause and region folded in"
    description: "Everything that describes a project in one row, so any fact is one join away from 'which organisation', 'which cause' or 'which region'."
    source: "projects, the published passports row (organisation, contractor, category), charities, sites (region by location)."
    history: "type 1: a change overwrites the row; history stays in the app database and on-chain"
    row_zero: "project_key 0 = 'No project': the target of a claim that was a refund rather than a move."
    primary_key: ["project_key"]
    columns:
      - name: "project_key"
        type: "integer"
        role: "primary key"
        nullable: false
        description: "Surrogate key. 0 means 'no project'."
        lineage: "generated"
        pii: "none"
        example: 7
      - name: "project_id"
        type: "uuid"
        role: "natural key"
        nullable: true
        description: "The project's id in the app (projects.id)."
        lineage: "projects.id"
        pii: "none"
        example: "0b3e…91"
      - name: "title"
        type: "text"
        role: "attribute"
        nullable: false
        description: "The project's name."
        lineage: "projects.title"
        pii: "none"
        example: "Homes for returning families in Aghdam"
      - name: "status"
        type: "text"
        role: "attribute"
        nullable: false
        description: "draft, published, live, stopped or completed ('none' on row 0)."
        lineage: "projects.status"
        pii: "none"
        example: "live"
      - name: "goal_qapik"
        type: "bigint"
        role: "attribute"
        nullable: false
        description: "The goal: the sum of its milestones' budgets."
        lineage: "projects.total_qapik"
        pii: "none"
        example: 18000000
      - name: "milestone_count"
        type: "smallint"
        role: "attribute"
        nullable: false
        description: "How many milestones the Passport has."
        lineage: "count of milestones"
        pii: "none"
        example: 4
      - name: "published_date"
        type: "date"
        role: "attribute"
        nullable: true
        description: "The day its Passport was published (Baku time)."
        lineage: "projects.published_at"
        pii: "none"
        example: "2026-09-14"
      - name: "organisation_id"
        type: "uuid"
        role: "attribute"
        nullable: true
        description: "The organisation's id in the app (charities.id)."
        lineage: "projects.charity_id"
        pii: "none"
        example: "a41d…0c"
      - name: "organisation_name"
        type: "text"
        role: "attribute"
        nullable: true
        description: "The organisation's registered name."
        lineage: "charities.legal_name"
        pii: "none"
        example: "Bərəkət İctimai Birliyi"
      - name: "organisation_voen"
        type: "text"
        role: "attribute"
        nullable: true
        description: "The organisation's tax number (public)."
        lineage: "charities.voen"
        pii: "none"
        example: "1700000011"
      - name: "contractor_name"
        type: "text"
        role: "attribute"
        nullable: true
        description: "The contractor the Passport names: the only company the escrow can pay."
        lineage: "Passport: contractor.legal_name"
        pii: "none"
        example: "Qarabağ Tikinti MMC"
      - name: "contractor_voen"
        type: "text"
        role: "attribute"
        nullable: true
        description: "The contractor's tax number (public)."
        lineage: "Passport: contractor.voen"
        pii: "none"
        example: "1400000027"
      - name: "cause_code"
        type: "text"
        role: "attribute"
        nullable: true
        description: "The web app's cause (14 of them)."
        lineage: "the web app's cause list, matched by Passport category and project"
        pii: "none"
        example: "housing"
      - name: "cause_name"
        type: "text"
        role: "attribute"
        nullable: true
        description: "The cause as shown to donors."
        lineage: "the web app's cause list"
        pii: "none"
        example: "Housing"
      - name: "passport_category"
        type: "text"
        role: "attribute"
        nullable: true
        description: "The Passport's category (8 of them); each cause belongs to one."
        lineage: "Passport: category"
        pii: "none"
        example: "housing"
      - name: "region_code"
        type: "text"
        role: "attribute"
        nullable: true
        description: "One of Azerbaijan's 14 economic regions, or a country code for work abroad."
        lineage: "sites.geom inside a region boundary"
        pii: "none"
        example: "karabakh"
      - name: "region_name"
        type: "text"
        role: "attribute"
        nullable: true
        description: "The region as shown on the map."
        lineage: "region boundary file"
        pii: "none"
        example: "Karabakh"
      - name: "country"
        type: "text"
        role: "attribute"
        nullable: true
        description: "Country where the work happens."
        lineage: "region boundary file"
        pii: "none"
        example: "Azerbaijan"
      - name: "is_abroad"
        type: "boolean"
        role: "attribute"
        nullable: false
        description: "True for work outside Azerbaijan (for example Ukraine)."
        lineage: "country"
        pii: "none"
        example: false
      - name: "escrow_address"
        type: "text"
        role: "attribute"
        nullable: true
        description: "The project's escrow contract on-chain."
        lineage: "projects.escrow_address"
        pii: "none"
        example: "0x5FbD…0aa3"
  - name: "dim_milestone"
    type: "dimension"
    grain: "one milestone of one project; row 0 stands for 'the whole project'"
    description: "The stages money is held, proven and released in."
    source: "milestones (app database)."
    history: "type 1: status overwrites; each status change is also an event in the facts"
    row_zero: "milestone_key 0 = 'Whole project': used by stop votes, Passport changes and claims, which are about a project, not one milestone."
    primary_key: ["milestone_key"]
    columns:
      - name: "milestone_key"
        type: "integer"
        role: "primary key"
        nullable: false
        description: "Surrogate key. 0 means 'the whole project'."
        lineage: "generated"
        pii: "none"
        example: 31
      - name: "milestone_id"
        type: "uuid"
        role: "natural key"
        nullable: true
        description: "The milestone's id in the app (milestones.id)."
        lineage: "milestones.id"
        pii: "none"
        example: "c2a0…5d"
      - name: "milestone_number"
        type: "smallint"
        role: "attribute"
        nullable: false
        description: "1 for the first milestone (milestones.index + 1); 0 on row 0."
        lineage: "milestones.index"
        pii: "none"
        example: 2
      - name: "title"
        type: "text"
        role: "attribute"
        nullable: false
        description: "What will be done."
        lineage: "milestones.title"
        pii: "none"
        example: "Walls and roofs for 12 houses"
      - name: "budget_qapik"
        type: "bigint"
        role: "attribute"
        nullable: false
        description: "Its budget: the sum of its budget lines."
        lineage: "milestones.amount_qapik"
        pii: "none"
        example: 6400000
      - name: "window_opens"
        type: "date"
        role: "attribute"
        nullable: true
        description: "First day the work may be shown."
        lineage: "milestones.window_opens"
        pii: "none"
        example: "2026-10-01"
      - name: "window_closes"
        type: "date"
        role: "attribute"
        nullable: true
        description: "Last day of its window."
        lineage: "milestones.window_closes"
        pii: "none"
        example: "2026-12-15"
      - name: "status"
        type: "text"
        role: "attribute"
        nullable: false
        description: "funding, evidence_submitted, checked, officer_approved, voting, approved, released, paid, rejected or stopped ('none' on row 0)."
        lineage: "milestones.status"
        pii: "none"
        example: "voting"
  - name: "fact_donation"
    type: "fact"
    grain: "one donation's share for one milestone (an allocation in the app database)"
    description: "Money in. A card payment split across three milestones is three rows; their sum is the payment."
    source: "allocations joined to donations and batches."
    primary_key: ["allocation_id"]
    columns:
      - name: "allocation_id"
        type: "uuid"
        role: "primary key (degenerate)"
        nullable: false
        description: "The allocation's id in the app: the leaf of the hourly Merkle tree."
        lineage: "allocations.id"
        pii: "none"
        example: "9e77…a1"
      - name: "donation_id"
        type: "uuid"
        role: "degenerate dimension"
        nullable: false
        description: "The payment this share came from. count(DISTINCT donation_id) counts payments."
        lineage: "allocations.donation_id"
        pii: "none"
        example: "51f0…3b"
      - name: "date_key"
        type: "integer"
        role: "foreign key"
        nullable: false
        references: "dim_date"
        description: "The day the money was received (Baku time)."
        lineage: "donations.created_at"
        pii: "none"
        example: 20261102
      - name: "donor_key"
        type: "integer"
        role: "foreign key"
        nullable: false
        references: "dim_donor"
        description: "Who gave; 0 for a guest."
        lineage: "donations.user_id"
        pii: "none"
        example: 42
      - name: "project_key"
        type: "integer"
        role: "foreign key"
        nullable: false
        references: "dim_project"
        description: "The project."
        lineage: "allocations.project_id"
        pii: "none"
        example: 7
      - name: "milestone_key"
        type: "integer"
        role: "foreign key"
        nullable: false
        references: "dim_milestone"
        description: "The milestone this share funds."
        lineage: "allocations.project_id + milestone_index"
        pii: "none"
        example: 31
      - name: "donation_kind"
        type: "text"
        role: "attribute"
        nullable: false
        description: "card, pay_on_proof (a pledge charged on approval) or redirect (moved from a stopped project)."
        lineage: "donations.kind"
        pii: "none"
        example: "card"
      - name: "status"
        type: "text"
        role: "attribute"
        nullable: false
        description: "received, batched, in_escrow, claimed or void."
        lineage: "allocations.status"
        pii: "none"
        example: "in_escrow"
      - name: "is_anchored"
        type: "boolean"
        role: "attribute"
        nullable: false
        description: "Its hourly batch is anchored on-chain."
        lineage: "batches.status IN (anchored, settled)"
        pii: "none"
        example: true
      - name: "amount_qapik"
        type: "bigint"
        role: "measure"
        nullable: false
        measure: "additive"
        description: "The share, in qəpik."
        lineage: "allocations.amount_qapik"
        pii: "none"
        example: 2500
  - name: "fact_evidence_check"
    type: "fact"
    grain: "one of the 11 checks, run on one evidence bundle"
    description: "Proof. Every bundle of photos, video and invoices gets the same 11 checks; this table says how each went."
    source: "evidence_checks joined to evidence_bundles and capture_sessions."
    primary_key: ["bundle_id", "check_number"]
    columns:
      - name: "bundle_id"
        type: "uuid"
        role: "primary key, part 1 (degenerate)"
        nullable: false
        description: "The evidence bundle's id in the app."
        lineage: "evidence_checks.bundle_id"
        pii: "none"
        example: "77aa…0f"
      - name: "check_number"
        type: "smallint"
        role: "primary key, part 2"
        nullable: false
        description: "1 to 11, as in the check catalogue."
        lineage: "evidence_checks.number"
        pii: "none"
        example: 2
      - name: "date_key"
        type: "integer"
        role: "foreign key"
        nullable: false
        references: "dim_date"
        description: "The day the bundle was checked."
        lineage: "evidence_checks.created_at"
        pii: "none"
        example: 20261105
      - name: "project_key"
        type: "integer"
        role: "foreign key"
        nullable: false
        references: "dim_project"
        description: "The project."
        lineage: "capture_sessions.project_id"
        pii: "none"
        example: 7
      - name: "milestone_key"
        type: "integer"
        role: "foreign key"
        nullable: false
        references: "dim_milestone"
        description: "The milestone the evidence is for."
        lineage: "capture_sessions.project_id + milestone_index"
        pii: "none"
        example: 31
      - name: "attempt"
        type: "smallint"
        role: "attribute"
        nullable: false
        description: "1 for the first evidence; resubmitted evidence counts up."
        lineage: "capture_sessions.attempt"
        pii: "none"
        example: 1
      - name: "check_name"
        type: "text"
        role: "attribute"
        nullable: false
        description: "Short name: files_and_signatures, geofence, time_window, challenge_code, photo_reuse, content_credentials, deliverable, invoice, fiscal_receipt, contractor_voen, proof_checklist."
        lineage: "evidence_checks.name"
        pii: "none"
        example: "geofence"
      - name: "check_kind"
        type: "text"
        role: "attribute"
        nullable: false
        description: "hard (a failure blocks the release unless the officer overrides it, with a reason) or advisory."
        lineage: "evidence_checks.kind"
        pii: "none"
        example: "hard"
      - name: "result"
        type: "text"
        role: "attribute"
        nullable: false
        description: "passed, failed, advisory (noted, never blocks) or not_run."
        lineage: "evidence_checks.status"
        pii: "none"
        example: "passed"
      - name: "is_passed"
        type: "boolean"
        role: "measure"
        nullable: false
        measure: "non-additive (average it)"
        description: "result = passed. Average it for a pass rate."
        lineage: "evidence_checks.status"
        pii: "none"
        example: true
  - name: "fact_release"
    type: "fact"
    grain: "one release of a milestone's money from escrow to its contractor"
    description: "Money out. Written when the escrow releases a milestone; completed when the bank confirms it paid."
    source: "releases joined to payouts, evidence_bundles, ballots."
    primary_key: ["release_id"]
    columns:
      - name: "release_id"
        type: "uuid"
        role: "primary key (degenerate)"
        nullable: false
        description: "The release's id in the app."
        lineage: "releases.id"
        pii: "none"
        example: "e0c4…19"
      - name: "released_date_key"
        type: "integer"
        role: "foreign key (role: released)"
        nullable: false
        references: "dim_date"
        description: "The day the escrow released the money."
        lineage: "releases.created_at"
        pii: "none"
        example: 20261106
      - name: "paid_date_key"
        type: "integer"
        role: "foreign key (role: paid)"
        nullable: false
        references: "dim_date"
        description: "The day the bank confirmed paying the contractor; 0 until then."
        lineage: "payouts.updated_at where status = confirmed"
        pii: "none"
        example: 20261108
      - name: "project_key"
        type: "integer"
        role: "foreign key"
        nullable: false
        references: "dim_project"
        description: "The project."
        lineage: "releases.project_id"
        pii: "none"
        example: 7
      - name: "milestone_key"
        type: "integer"
        role: "foreign key"
        nullable: false
        references: "dim_milestone"
        description: "The milestone released."
        lineage: "releases.project_id + milestone_index"
        pii: "none"
        example: 31
      - name: "attempt"
        type: "smallint"
        role: "attribute"
        nullable: false
        description: "The evidence attempt that was approved."
        lineage: "releases.attempt"
        pii: "none"
        example: 1
      - name: "approved_by"
        type: "text"
        role: "attribute"
        nullable: false
        description: "donor_vote (turnout reached and more than half said yes) or officer_fallback (too few voted, so the officer's decision stood, as the Passport allows)."
        lineage: "ballots.turnout_fallback"
        pii: "none"
        example: "donor_vote"
      - name: "released_qapik"
        type: "bigint"
        role: "measure"
        nullable: false
        measure: "additive"
        description: "Money released, in qəpik."
        lineage: "releases.amount_qapik"
        pii: "none"
        example: 6400000
      - name: "days_evidence_to_paid"
        type: "numeric(6,1)"
        role: "measure"
        nullable: true
        measure: "non-additive (average or median it)"
        description: "Days from the evidence being anchored on-chain to the bank's confirmation. Empty until paid."
        lineage: "evidence_bundles.anchored_at, payouts.updated_at"
        pii: "none"
        example: 4.0
  - name: "fact_ballot"
    type: "fact"
    grain: "one vote that donors were asked to take (one ballot)"
    description: "Decisions. A ballot opens after the officer approves a milestone (or to change a Passport, or to stop a project)."
    source: "ballots (app database), filled from the voting contract's events."
    primary_key: ["ballot_id"]
    columns:
      - name: "ballot_id"
        type: "text"
        role: "primary key (degenerate)"
        nullable: false
        description: "The ballot's id on-chain, as 0x and 64 hex digits."
        lineage: "ballots.id"
        pii: "none"
        example: "0x3f9a…c2"
      - name: "end_date_key"
        type: "integer"
        role: "foreign key"
        nullable: false
        references: "dim_date"
        description: "The day voting ends (Baku time)."
        lineage: "ballots.ends_at"
        pii: "none"
        example: 20261109
      - name: "project_key"
        type: "integer"
        role: "foreign key"
        nullable: false
        references: "dim_project"
        description: "The project."
        lineage: "ballots.project_id"
        pii: "none"
        example: 7
      - name: "milestone_key"
        type: "integer"
        role: "foreign key"
        nullable: false
        references: "dim_milestone"
        description: "The milestone voted on; 0 for a stop or a Passport change."
        lineage: "ballots.project_id + milestone_index"
        pii: "none"
        example: 31
      - name: "ballot_kind"
        type: "text"
        role: "attribute"
        nullable: false
        description: "milestone, amendment (a Passport change) or stop."
        lineage: "ballots.kind"
        pii: "none"
        example: "milestone"
      - name: "round"
        type: "smallint"
        role: "attribute"
        nullable: false
        description: "Which try: the milestone's evidence attempt, or the stop proposal's number."
        lineage: "ballots.round"
        pii: "none"
        example: 1
      - name: "eligible_count"
        type: "integer"
        role: "measure"
        nullable: false
        measure: "additive"
        description: "Receipts that may vote: donors to that project, at the moment it opened."
        lineage: "ballots.eligible"
        pii: "none"
        example: 214
      - name: "yes_count"
        type: "integer"
        role: "measure"
        nullable: false
        measure: "additive"
        description: "Votes for. One receipt, one vote, if its money reaches the Passport's minimum (₼5 by default)."
        lineage: "ballots.yes"
        pii: "none"
        example: 61
      - name: "no_count"
        type: "integer"
        role: "measure"
        nullable: false
        measure: "additive"
        description: "Votes against."
        lineage: "ballots.no"
        pii: "none"
        example: 9
      - name: "is_passed"
        type: "boolean"
        role: "attribute"
        nullable: true
        description: "The result; empty while voting is open."
        lineage: "ballots.passed"
        pii: "none"
        example: true
      - name: "is_turnout_fallback"
        type: "boolean"
        role: "attribute"
        nullable: true
        description: "Too few voted (under 10% by default), so the fallback rule decided; empty while open."
        lineage: "ballots.turnout_fallback"
        pii: "none"
        example: false
  - name: "fact_claim"
    type: "fact"
    grain: "one donor's choice for their money after a project was stopped"
    description: "The safety net. When a project stops, each donor takes a refund or moves the money to another project; doing nothing applies the default."
    source: "claims (app database)."
    primary_key: ["claim_id"]
    columns:
      - name: "claim_id"
        type: "uuid"
        role: "primary key (degenerate)"
        nullable: false
        description: "The claim's id in the app."
        lineage: "claims.id"
        pii: "none"
        example: "f81b…7e"
      - name: "date_key"
        type: "integer"
        role: "foreign key"
        nullable: false
        references: "dim_date"
        description: "The day the claim was made."
        lineage: "claims.created_at"
        pii: "none"
        example: 20261020
      - name: "donor_key"
        type: "integer"
        role: "foreign key"
        nullable: false
        references: "dim_donor"
        description: "Whose money it is."
        lineage: "claims.user_id"
        pii: "none"
        example: 42
      - name: "project_key"
        type: "integer"
        role: "foreign key (role: stopped project)"
        nullable: false
        references: "dim_project"
        description: "The project that stopped."
        lineage: "claims.project_id"
        pii: "none"
        example: 12
      - name: "target_project_key"
        type: "integer"
        role: "foreign key (role: target project)"
        nullable: false
        references: "dim_project"
        description: "Where the money moved; 0 for a refund."
        lineage: "claims.target_project_id"
        pii: "none"
        example: 7
      - name: "action"
        type: "text"
        role: "attribute"
        nullable: false
        description: "refund or redirect."
        lineage: "claims.action"
        pii: "none"
        example: "redirect"
      - name: "is_default"
        type: "boolean"
        role: "attribute"
        nullable: false
        description: "Chosen by the default rule because the donor did not choose in time."
        lineage: "claims.by_default"
        pii: "none"
        example: false
      - name: "status"
        type: "text"
        role: "attribute"
        nullable: false
        description: "submitted, executed or failed."
        lineage: "claims.status"
        pii: "none"
        example: "executed"
      - name: "amount_qapik"
        type: "bigint"
        role: "measure"
        nullable: false
        measure: "additive"
        description: "Money the claim covers, in qəpik."
        lineage: "claims.amount_qapik (sum of its allocations)"
        pii: "none"
        example: 2870
