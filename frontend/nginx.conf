server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Evidence photos and organisation documents go straight to the API; the API's own
    # body limits (20 MB per document) are the ones that matter.
    client_max_body_size 25M;

    # The single-page app: every unknown path is a route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change; cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The Veritas API on the same origin, so the browser needs no CORS. `api` is the
    # backend's service name in docker compose; change it to wherever the API runs.
    location /v1/ {
        proxy_pass http://api:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }
}
