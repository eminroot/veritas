<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Veritas — transparent giving in Azerbaijan. Give to verified organisations' projects; your money waits in escrow and is released only when photos from the site prove the work is done." />
    <!-- One theme, light. The tinted #ebeff5 ground is what the browser chrome
         should match. -->
    <meta name="theme-color" content="#ebeff5" />
    <meta property="og:title" content="Veritas · Every manat, proven" />
    <meta property="og:description" content="Donations held in escrow and released milestone by milestone, on proof from the site." />
    <meta property="og:image" content="/img/builders-smiling.jpg" />
    <title>Veritas · Every manat, proven</title>

    <!-- The type system, lifted from the MuhAI design language:
         Inter Tight carries every line (it is drawn for headline sizes, so
         -0.04em tracking at 88px holds together), Syne draws the wordmark,
         IBM Plex Mono the machine text (receipts, hashes). Separate requests
         so a failure on one cannot take the others down. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
