name: contracts

on:
  push:
    paths:
      - "contracts/**"
      - "backend/src/veritas/chain/artifacts/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "backend/src/veritas/chain/artifacts/**"
      - ".github/workflows/contracts.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge lint
      - run: forge test -vv
      - name: Backend artifacts match this build
        working-directory: backend
        run: python3 scripts/export_abis.py --check
