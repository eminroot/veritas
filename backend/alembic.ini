# Alembic configuration for the Veritas database.
#
# The database URL is not set here. migrations/env.py takes it from
# `-x url=...` on the command line, or else from VERITAS_DATABASE_URL (or .env).
#
# New migrations are numbered by hand so the order is obvious:
#   uv run alembic revision -m "money tables" --rev-id 0002

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
