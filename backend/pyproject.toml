[project]
name = "veritas-backend"
version = "0.1.0"
description = "API, workers and chain services for Veritas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "eth-hash[pycryptodome]>=0.7",
    "rfc8785>=0.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veritas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["veritas"]
