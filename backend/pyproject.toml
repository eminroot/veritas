[project]
name = "veritas-backend"
version = "0.1.0"
description = "API, workers and chain services for Veritas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "eth-abi>=5",
    "eth-account>=0.13",
    "eth-hash[pycryptodome]>=0.7",
    "fastapi>=0.115",
    "geoalchemy2>=0.16",
    "httpx>=0.28",
    "imagehash>=4.3",
    "opencv-python-headless>=4.10",
    "pillow>=11",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "rfc8785>=0.1.4",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
    "web3>=7.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veritas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["veritas"]
